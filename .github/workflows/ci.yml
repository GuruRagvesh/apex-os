name: CI

# Typecheck, unit tests, builds, whitespace, and the database-backed suites.
#
# The database suites run only against the throwaway PostgreSQL container below,
# named apex_os_attendance_integration on loopback -- the only database their
# guard (backend/test/integration-pg/db-guard.ts) accepts. This workflow uses
# no secrets, never reaches a hosted database, and does not deploy.
#
# Every step runs the same npm script a developer runs locally.

on:
  pull_request:
  push:
    branches:
      - main
      - staging

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck, unit tests and builds
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Whitespace (git diff --check)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$BASE_SHA" ] && git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            git diff --check "$BASE_SHA" HEAD
          else
            git diff --check HEAD~1 HEAD
          fi

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install
        run: npm ci

      - name: Backend typecheck
        run: npm run typecheck --workspace backend

      - name: Frontend typecheck
        run: npm run typecheck --workspace frontend

      - name: Backend unit tests
        run: npm run test:unit --workspace backend

      - name: Backend build
        run: npm run build --workspace backend

      - name: Frontend build
        run: npm run build --workspace frontend

  database:
    name: PostgreSQL integration tests
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://apex_test@127.0.0.1:5432/apex_os_attendance_integration?schema=public
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Host networking, not a `services:` container. The guard asks the server
      # which address it answered on and accepts only loopback; behind a
      # service container's port mapping the server answers on its bridge IP.
      - name: Start throwaway PostgreSQL on loopback
        run: |
          docker run -d --name apex-int-pg --network host \
            -e POSTGRES_USER=apex_test \
            -e POSTGRES_HOST_AUTH_METHOD=trust \
            -e POSTGRES_DB=apex_os_attendance_integration \
            -e TZ=UTC \
            postgres:18 -c listen_addresses=127.0.0.1 -c port=5432 -c timezone=UTC
          for i in $(seq 1 30); do
            docker exec apex-int-pg pg_isready -h 127.0.0.1 -U apex_test -d apex_os_attendance_integration && exit 0
            sleep 2
          done
          docker logs apex-int-pg
          exit 1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install
        run: npm ci

      - name: Apply migrations to the throwaway database
        run: npm run db:migrate:deploy --workspace backend

      - name: PostgreSQL suites (ticket time engine, attendance)
        run: npm run test:int --workspace backend

      - name: API integration suites
        run: npm run test:api --workspace backend
