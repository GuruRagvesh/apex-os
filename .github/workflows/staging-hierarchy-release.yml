name: Verify staging hierarchy release

# This workflow verifies a deployment; it deliberately does not deploy code or
# run migrations. Database changes remain an explicit, human-confirmed release
# operation under docs/operations/deployment/MIGRATION_RELEASE_PROCEDURE.md.
on:
  push:
    branches: [staging]
    paths:
      - 'backend/**'
      - 'frontend/components/settings/OrganizationHierarchySection.tsx'
      - 'scripts/deployment/verify-staging-hierarchy.mjs'
      - '.github/workflows/staging-hierarchy-release.yml'
  workflow_dispatch:
    inputs:
      api_base_url:
        description: Staging API base URL, including /api
        required: false
        default: https://apex-os-backend-staging.onrender.com/api
      expected_commit:
        description: Commit expected to be deployed (defaults to the selected workflow ref)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: staging-hierarchy-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Backend, migration and route contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify the deployed staging hierarchy contract
        env:
          STAGING_API_URL: ${{ inputs.api_base_url || 'https://apex-os-backend-staging.onrender.com/api' }}
          EXPECTED_COMMIT: ${{ inputs.expected_commit || github.sha }}
        run: node scripts/deployment/verify-staging-hierarchy.mjs
